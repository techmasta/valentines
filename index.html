<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be My Valentine</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background">
      <div class="hearts" aria-hidden="true"></div>
    </div>

    <main class="card" aria-live="polite">
      <h1>Will you be my Valentine? 💖</h1>
      <p class="subtitle">Your answer controls the destiny of my heart.</p>

      <div class="buttons" id="buttons">
        <button class="btn yes" id="yesButton">YES</button>
        <button class="btn no" id="noButton">NO</button>
      </div>

      <div class="message" id="message" hidden>
        <h2>Yayyyy!! 💕 You just made my heart the happiest!</h2>
        <p>Sending you all the hugs, sparkles, and confetti love.</p>
      </div>
    </main>

    <div id="celebration" aria-hidden="true"></div>

    <script src="script.js"></script>
  </body>
</html>
